name: sast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  solidity-compile-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked compiler dependencies
        run: npm ci --ignore-scripts
      - name: Compile Solidity contract
        run: npm run build
      - name: Syntax-check host adapter
        run: node --check bin/stakeholder.mjs
