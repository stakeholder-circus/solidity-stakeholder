name: sast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  solidity-compile-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install locked compiler dependencies
        run: npm ci --ignore-scripts
      - name: Compile Solidity contract
        run: npm run build
      - name: Syntax-check host adapter
        run: node --check bin/stakeholder.mjs
