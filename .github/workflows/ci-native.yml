name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked compiler dependencies
        run: npm ci --ignore-scripts
      - name: Compiler proof
        run: make compiler-proof
      - name: Compile and test
        run: make test
